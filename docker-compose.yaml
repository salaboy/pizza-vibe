services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=store-db
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  store:
    build:
      context: .
      dockerfile: store/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OVEN_SERVICE_URL=http://oven:8085
      - INVENTORY_SERVICE_URL=http://inventory:8084
      - BIKES_SERVICE_URL=http://bikes:8088
      - DRINKS_STOCK_SERVICE_URL=http://drinks-stock:8090
      - STORE_MGMT_AGENT_URL=http://docker.for.mac.host.internal:9999
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/store-db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 10s
      retries: 3

  inventory:
    build:
      context: .
      dockerfile: inventory/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  oven:
    build:
      context: .
      dockerfile: oven/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bikes:
    build:
      context: .
      dockerfile: bikes/Dockerfile
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - STORE_URL=http://store:8080
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  drinks-stock:
    build:
      context: .
      dockerfile: drinks-stock/Dockerfile
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    environment:
      - DASH0_AUTH_TOKEN=${DASH0_AUTH_TOKEN}
      - DASH0_ENDPOINT_OTLP_GRPC_HOSTNAME=${DASH0_ENDPOINT_OTLP_GRPC_HOSTNAME:-ingress.eu-west-1.aws.dash0.com}
      - DASH0_ENDPOINT_OTLP_GRPC_PORT=${DASH0_ENDPOINT_OTLP_GRPC_PORT:-4317}
      - DASH0_DATASET=${DASH0_DATASET:-salaboy}
    networks:
      - pizza-network

  pizza-mcp:
    build:
      context: ./agents/pizza-mcp
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8086:8086"
    environment:
      - INVENTORY_SERVICE_URL=http://inventory:8084
      - OVEN_SERVICE_URL=http://oven:8085
      - STORE_SERVICE_URL=http://store:8080
      - DRINKS_STOCK_SERVICE_URL=http://drinks-stock:8090
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - otel-collector
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/q/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  cooking-agent:
    build:
      context: ./agents/cooking-agent
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8087:8087"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PIZZA_MCP_URL=http://pizza-mcp:8086/mcp/sse
      - STORE_SERVICE_URL=http://store:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - otel-collector
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8087/q/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  delivery-agent:
    build:
      context: .
      dockerfile: agents/delivery-agent/src/main/docker/Dockerfile.jvm
    ports:
      - "8089:8089"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BIKES_SERVICE_URL=http://bikes:8088
      - BIKES_SKILL_SCRIPTS_PATH=/deployments/skills/bikes/scripts
      - STORE_SERVICE_URL=http://store:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - otel-collector
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8089/q/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  store-mgmt-agent:
    build:
      context: ./agents/store-mgmt-agent
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "9999:9999"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PIZZA_MCP_URL=http://pizza-mcp:8086/mcp/sse
      - COOKING_AGENT_URL=http://cooking-agent:8087
      - DELIVERY_AGENT_URL=http://delivery-agent:8089
      - STORE_SERVICE_URL=http://store:8080
      - STORE_MGMT_AGENT_URL=http://store-mgmt-agent:9999
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - otel-collector
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9999/q/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  pizza-network:
    driver: bridge

apiVersion: apps/v1
kind: Deployment
metadata:
  name: oven
  labels:
    app: oven
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oven
  template:
    metadata:
      labels:
        app: oven
      annotations:
        instrumentation.opentelemetry.io/inject-go: "opentelemetry/instrumentation"
        instrumentation.opentelemetry.io/otel-go-auto-target-exe: "/app/oven"
    spec:
      containers:
        - name: oven
          image: salaboy/pizza-vibe-oven:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: PORT
              value: "8085"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
            - name: FLAGD_HOST
              value: "flagd-service"
            - name: FLAGD_PORT
              value: "8013"
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: oven
  labels:
    app: oven
spec:
  selector:
    app: oven
  ports:
    - port: 8085
      targetPort: 8085
      protocol: TCP
  type: ClusterIP

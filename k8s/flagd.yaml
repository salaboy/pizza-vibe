apiVersion: v1
kind: ConfigMap
metadata:
  name: flagd-config
  labels:
    app: flagd
data:
  flags.json: |
    {
      "$schema": "https://flagd.dev/schema/v0/flags.json",
      "flags": {
        "oven-chaos": {
          "state": "ENABLED",
          "variants": {
            "on": true,
            "off": false
          },
          "defaultVariant": "off"
        },
        "agent-chooser": {
          "state": "ENABLED",
          "variants": {
            "v1": "v1",
            "v2": "v2",
            "v3": "v3",
            "v4": "v4"
          },
          "defaultVariant": "v1"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  labels:
    app: flagd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagd
  template:
    metadata:
      labels:
        app: flagd
    spec:
      containers:
        - name: flagd
          image: ghcr.io/open-feature/flagd:latest
          args:
            - start
            - --uri
            - file:/etc/flagd/flags.json
          ports:
            - containerPort: 8013
              name: grpc
          volumeMounts:
            - name: flagd-config
              mountPath: /etc/flagd
      volumes:
        - name: flagd-config
          configMap:
            name: flagd-config
---
apiVersion: v1
kind: Service
metadata:
  name: flagd-service
  labels:
    app: flagd
spec:
  selector:
    app: flagd
  ports:
    - name: grpc
      port: 8013
      targetPort: 8013
      protocol: TCP
  type: ClusterIP

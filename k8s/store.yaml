apiVersion: apps/v1
kind: Deployment
metadata:
  name: store
  labels:
    app: store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store
  template:
    metadata:
      labels:
        app: store
      annotations:
        instrumentation.opentelemetry.io/inject-go: "opentelemetry/instrumentation"
        instrumentation.opentelemetry.io/otel-go-auto-target-exe: "/app/store"
    spec:
      containers:
        - name: store
          image: salaboy/pizza-vibe-store:patched-a2a-tracing
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: OVEN_SERVICE_URL
              value: "http://oven:8085"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory:8084"
            - name: BIKES_SERVICE_URL
              value: "http://bikes:8088"
            - name: DRINKS_STOCK_SERVICE_URL
              value: "http://drinks-stock:8090"
            - name: STORE_MGMT_AGENT_URL
              value: "http://store-mgmt-agent:9999"
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgresql.default.svc.cluster.local:5432/store-db?sslmode=disable"
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dash0-secrets
                  key: dash0-authorization-token
            - name: DASH0_ENDPOINT_HTTP_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: dash0-secrets
                  key: dash0-grpc-hostname
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: store
  labels:
    app: store
spec:
  selector:
    app: store
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: LoadBalancer

name: Build and publish all containers

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: salaboy

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare platform tag
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -------------------------------------------------------
      # Build fork dependencies (installed into local ~/.m2)
      # -------------------------------------------------------
      - name: Build a2a-java fork
        run: |
          git clone https://github.com/salaboy/a2a-java /tmp/a2a-java
          cd /tmp/a2a-java && mvn clean install -DskipTests -q

      - name: Build langchain4j fork
        run: |
          git clone -b 1.11.0-beta19-patched https://github.com/salaboy/langchain4j /tmp/langchain4j
          cd /tmp/langchain4j && mvn clean install -DskipTests -q

      # -------------------------------------------------------
      # Build Quarkus agent services
      # -------------------------------------------------------
      - name: Build agent services
        run: |
          for agent in pizza-mcp cooking-agent delivery-agent store-mgmt-agent; do
            echo "Building agents/$agent..."
            (cd agents/$agent && ./mvnw clean package -DskipTests -q)
          done

      # -------------------------------------------------------
      # Build and push all Docker images (by digest)
      # -------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build store
        id: build-store
        uses: docker/build-push-action@v6
        with:
          context: .
          file: store/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/pizza-vibe-store,push-by-digest=true,name-canonical=true,push=true

      - name: Build inventory
        id: build-inventory
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inventory/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/pizza-vibe-inventory,push-by-digest=true,name-canonical=true,push=true

      - name: Build oven
        id: build-oven
        uses: docker/build-push-action@v6
        with:
          context: .
          file: oven/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/pizza-vibe-oven,push-by-digest=true,name-canonical=true,push=true

      - name: Build bikes
        id: build-bikes
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bikes/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/pizza-vibe-bikes,push-by-digest=true,name-canonical=true,push=true

      - name: Build drinks-stock
        id: build-drinks-stock
        uses: docker/build-push-action@v6
        with:
          context: .
          file: drinks-stock/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/pizza-vibe-drinks-stock,push-by-digest=true,name-canonical=true,push=true

      - name: Build pizza-mcp
        id: build-pizza-mcp
        uses: docker/build-push-action@v6
        with:
          context: agents/pizza-mcp
          file: agents/pizza-mcp/src/main/docker/Dockerfile.jvm
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/pizza-vibe-pizza-mcp,push-by-digest=true,name-canonical=true,push=true

      - name: Build cooking-agent
        id: build-cooking-agent
        uses: docker/build-push-action@v6
        with:
          context: agents/cooking-agent
          file: agents/cooking-agent/src/main/docker/Dockerfile.jvm
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/pizza-vibe-cooking-agent,push-by-digest=true,name-canonical=true,push=true

      - name: Build delivery-agent
        id: build-delivery-agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/delivery-agent/src/main/docker/Dockerfile.jvm
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/pizza-vibe-delivery-agent,push-by-digest=true,name-canonical=true,push=true

      - name: Build store-mgmt-agent
        id: build-store-mgmt-agent
        uses: docker/build-push-action@v6
        with:
          context: agents/store-mgmt-agent
          file: agents/store-mgmt-agent/src/main/docker/Dockerfile.jvm
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/pizza-vibe-store-mgmt-agent,push-by-digest=true,name-canonical=true,push=true

      # -------------------------------------------------------
      # Collect all digests into per-service subdirectories
      # -------------------------------------------------------
      - name: Collect digests
        run: |
          mkdir -p /tmp/digests/{store,inventory,oven,bikes,drinks-stock,pizza-mcp,cooking-agent,delivery-agent,store-mgmt-agent}
          declare -A pairs=(
            [store]="${{ steps.build-store.outputs.digest }}"
            [inventory]="${{ steps.build-inventory.outputs.digest }}"
            [oven]="${{ steps.build-oven.outputs.digest }}"
            [bikes]="${{ steps.build-bikes.outputs.digest }}"
            [drinks-stock]="${{ steps.build-drinks-stock.outputs.digest }}"
            [pizza-mcp]="${{ steps.build-pizza-mcp.outputs.digest }}"
            [cooking-agent]="${{ steps.build-cooking-agent.outputs.digest }}"
            [delivery-agent]="${{ steps.build-delivery-agent.outputs.digest }}"
            [store-mgmt-agent]="${{ steps.build-store-mgmt-agent.outputs.digest }}"
          )
          for svc in "${!pairs[@]}"; do
            digest="${pairs[$svc]}"
            touch "/tmp/digests/${svc}/${digest#sha256:}"
          done

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest lists and push
        run: |
          set -euo pipefail
          REGISTRY="${{ env.REGISTRY }}"

          increment_version() {
            local CURRENT
            CURRENT=$(cat "$1" | tr -d '[:space:]')
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            PATCH=$((PATCH + 1))
            echo "${MAJOR}.${MINOR}.${PATCH}"
          }

          push_manifest() {
            local image="$1" version="$2" digest_dir="$3"
            docker buildx imagetools create \
              -t "${image}:${version}" \
              -t "${image}:latest" \
              $(cd "$digest_dir" && printf "${image}@sha256:%s " *)
          }

          # Go services
          STORE_VER=$(increment_version store/VERSION)
          push_manifest "${REGISTRY}/pizza-vibe-store"       "$STORE_VER"    /tmp/digests/store

          INVENTORY_VER=$(increment_version inventory/VERSION)
          push_manifest "${REGISTRY}/pizza-vibe-inventory"   "$INVENTORY_VER" /tmp/digests/inventory

          OVEN_VER=$(increment_version oven/VERSION)
          push_manifest "${REGISTRY}/pizza-vibe-oven"        "$OVEN_VER"     /tmp/digests/oven

          BIKES_VER=$(increment_version bikes/VERSION)
          push_manifest "${REGISTRY}/pizza-vibe-bikes"       "$BIKES_VER"    /tmp/digests/bikes

          DRINKS_VER=$(increment_version drinks-stock/VERSION)
          push_manifest "${REGISTRY}/pizza-vibe-drinks-stock" "$DRINKS_VER"  /tmp/digests/drinks-stock

          # Quarkus agents
          PIZZA_MCP_VER=$(increment_version agents/pizza-mcp/VERSION)
          push_manifest "${REGISTRY}/pizza-vibe-pizza-mcp"   "$PIZZA_MCP_VER" /tmp/digests/pizza-mcp

          COOKING_VER=$(increment_version agents/cooking-agent/VERSION)
          push_manifest "${REGISTRY}/pizza-vibe-cooking-agent" "$COOKING_VER" /tmp/digests/cooking-agent

          DELIVERY_VER=$(increment_version agents/delivery-agent/VERSION)
          push_manifest "${REGISTRY}/pizza-vibe-delivery-agent" "$DELIVERY_VER" /tmp/digests/delivery-agent

          STORE_MGMT_VER=$(increment_version agents/store-mgmt-agent/VERSION)
          push_manifest "${REGISTRY}/pizza-vibe-store-mgmt-agent" "$STORE_MGMT_VER" /tmp/digests/store-mgmt-agent

          # Update all VERSION files
          echo "$STORE_VER"      > store/VERSION
          echo "$INVENTORY_VER"  > inventory/VERSION
          echo "$OVEN_VER"       > oven/VERSION
          echo "$BIKES_VER"      > bikes/VERSION
          echo "$DRINKS_VER"     > drinks-stock/VERSION
          echo "$PIZZA_MCP_VER"  > agents/pizza-mcp/VERSION
          echo "$COOKING_VER"    > agents/cooking-agent/VERSION
          echo "$DELIVERY_VER"   > agents/delivery-agent/VERSION
          echo "$STORE_MGMT_VER" > agents/store-mgmt-agent/VERSION

          # Commit all version bumps in a single commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            store/VERSION inventory/VERSION oven/VERSION bikes/VERSION drinks-stock/VERSION \
            agents/pizza-mcp/VERSION agents/cooking-agent/VERSION \
            agents/delivery-agent/VERSION agents/store-mgmt-agent/VERSION
          git commit -m "release all containers"
          git pull --rebase
          git push

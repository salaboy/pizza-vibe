name: Build and publish store-mgmt-agent

on:
  push:
    branches: [main]
    paths:
      - 'agents/store-mgmt-agent/**'
  workflow_dispatch:

env:
  REGISTRY: salaboy
  IMAGE: pizza-vibe-store-mgmt-agent

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare platform tag
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build store-mgmt-agent
        run: cd agents/store-mgmt-agent && ./mvnw clean package -DskipTests -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push store-mgmt-agent image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: agents/store-mgmt-agent
          file: agents/store-mgmt-agent/src/main/docker/Dockerfile.jvm
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Collect digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        run: |
          set -euo pipefail
          CURRENT=$(cat agents/store-mgmt-agent/VERSION | tr -d '[:space:]')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE }}:${VERSION}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE }}:latest" \
            $(cd /tmp/digests && printf "${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s " *)

          echo "$VERSION" > agents/store-mgmt-agent/VERSION

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents/store-mgmt-agent/VERSION
          git commit -m "release store-mgmt-agent"
          git pull --rebase
          git push
